name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build all platforms
        strategy:
          fail-fast: false
          matrix:
            include:
              - goos: windows
                goarch: amd64
                ext: .exe
                archive: zip
              - goos: darwin
                goarch: amd64
                ext: ''
                archive: tar.gz
              - goos: darwin
                goarch: arm64
                ext: ''
                archive: tar.gz
              - goos: linux
                goarch: amd64
                ext: ''
                archive: tar.gz
              - goos: linux
                goarch: arm64
                ext: ''
                archive: tar.gz
        run: |
          name="dlnacast-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "dist/${name}/dlnacast${{ matrix.ext }}" .
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${name}.zip" "${name}"
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          cd ..

      - name: Delete existing latest release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create latest release
        run: |
          gh release create latest dist/*.zip dist/*.tar.gz \
            --title "latest" \
            --notes "Automated build from main branch ($(git rev-parse --short HEAD))." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
